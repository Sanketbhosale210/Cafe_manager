{% extends "base.html" %}
{% block title %}{{ title }} · Cafe 11:11{% endblock %}
{% block content %}
<h1>{{ title }}</h1>
<div class="card" style="max-width:500px;">
  <form method="post">
    {% csrf_token %}
    {% for field in form %}
    <div class="field">
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
      {{ field.errors }}
    </div>
    {% endfor %}
    <button class="btn" type="submit">Save</button>
    <a class="btn btn-secondary" href="{% url 'accounts:staff_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
