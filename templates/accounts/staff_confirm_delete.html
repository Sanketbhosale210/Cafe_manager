{% extends "base.html" %}
{% block content %}
<h1>Delete {{ staff_member.username }}?</h1>
<div class="card" style="max-width:500px;">
  <p>This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-danger" type="submit">Yes, delete</button>
    <a class="btn btn-secondary" href="{% url 'accounts:staff_list' %}">Cancel</a>
  </form>
</div>
{% endblock %}
